name: Windows compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest
    env:
      # GitHub 的 Windows Runner 可能把重定向输出设为 cp1252；
      # 估值评测会输出中文，统一启用 UTF-8，避免仅日志编码失败。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q tests
      - name: Run evaluation
        run: python eval/run_eval.py
      - name: Smoke-test Windows workspace wrapper
        shell: pwsh
        run: |
          python -m finagent.report_pipeline build --company 贵州茅台 --year 2025 --dest "$env:RUNNER_TEMP\finagent-sample" --price 1500 --price-source "CI 示例行情"
          $workspace = Join-Path $env:RUNNER_TEMP 'finagent-sample\贵州茅台_2025'
          Push-Location $workspace
          try {
            & .\py.cmd -m finagent.report_pipeline status
            # A fresh workspace is intentionally incomplete: status returns 1 until all 8 gates pass.
            if ($LASTEXITCODE -ne 1) { throw "py.cmd status expected incomplete exit 1, got: $LASTEXITCODE" }
            & .\py.cmd -m finagent.safe_report --help
            if ($LASTEXITCODE -ne 0) { throw "py.cmd renderer help failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
