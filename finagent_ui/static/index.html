<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinAgent · 可追溯投研流水线</title><link rel="stylesheet" href="icons/bootstrap-icons.css"><link rel="stylesheet" href="style.css"></head><body><div id="viewport"><div id="app"></div></div>
<dialog id="upload"><form id="task-form"><h2>上传 / 更换年报</h2><p>调用原项目五个 Agent；盲审本次只提供独立选项。</p><label>年报 PDF<input name="pdf" type="file" accept="application/pdf,.pdf" required></label><div class="fields"><label>公司名称<input name="company" required placeholder="填写年报对应公司"></label><label>年报年度<input name="year" type="number" min="1990" max="2100" required placeholder="2025"></label></div><div class="fields"><label>当前股价（可选）<input name="price" type="number" min="0.01" step="any"></label><label>股价来源<input name="price_source" placeholder="填写股价时必填"></label></div><label>服务地址<input name="api" type="url" placeholder="本地使用留空；公开页需填写已部署的 HTTPS 后端"></label><label>服务访问凭证<input name="token" type="password" autocomplete="off" placeholder="由后端管理员提供；仅本次浏览器会话保存"></label><label class="check"><input name="consent" type="checkbox" required>我确认使用这份上传年报（尚未在项目来源清单核验）。</label><p class="error" id="form-error"></p><div class="buttons"><button type="button" id="cancel">取消</button><button type="submit" class="red">上传并开始</button></div></form></dialog>
<dialog id="info"><h2 id="info-title"></h2><p id="info-text"></p><button id="info-close">关闭</button></dialog><script src="app.js"></script></body></html>
